name: Deploy

# Builds the app and deploys to Firebase.
#  - push to main           -> deploy live hosting + Firestore rules + Cloud Functions
#  - pull request           -> deploy to a temporary preview channel (hosting only)
#
# Required GitHub repository secrets (Settings > Secrets and variables > Actions):
#   DOPPLER_TOKEN            A Doppler *service token* for project `dnd`, config `prd`
#                            (Doppler dashboard > dnd > prd > Access > Service Tokens).
#                            Injects the VITE_FIREBASE_* build vars.
#   FIREBASE_SERVICE_ACCOUNT The JSON key of a Firebase service account with deploy
#                            permissions. Hosting + rules need Firebase Hosting Admin +
#                            Cloud Datastore Owner. The Cloud Functions deploy step ALSO
#                            needs Cloud Functions Admin + Service Account User + Secret
#                            Manager access (functions load GMAIL_APP_PASSWORD from Secret
#                            Manager at runtime). If the SA lacks those, the functions
#                            step will fail — grant the roles or remove that step.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.event_name == 'push' && 'firebase-production' || format('firebase-preview-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Node 22 (matches the functions runtime) for the Cloud Functions predeploy build.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test Workshop manager contract
        run: bun run test:workshop-manager

      # Doppler's action performs a single CLI download and can fail on a brief
      # network stall. The official shell installer is recommended for ephemeral
      # CI jobs; fetch it with retries and install into the runner temp directory.
      - name: Install Doppler CLI
        run: |
          mkdir -p "$RUNNER_TEMP/doppler-bin"
          curl -Ls --fail --tlsv1.2 --proto "=https" \
            --retry 5 --retry-all-errors --retry-delay 2 \
            --connect-timeout 20 --max-time 180 \
            https://cli.doppler.com/install.sh \
            -o "$RUNNER_TEMP/install-doppler.sh"
          for attempt in 1 2 3; do
            if sh "$RUNNER_TEMP/install-doppler.sh" --install-path "$RUNNER_TEMP/doppler-bin"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Doppler CLI installation failed after $attempt attempts."
              exit 1
            fi
            rm -f "$RUNNER_TEMP/doppler-bin/doppler"
            sleep $((attempt * 3))
          done
          echo "$RUNNER_TEMP/doppler-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/doppler-bin/doppler" --version

      - name: Build
        run: doppler run --token="$DOPPLER_TOKEN" -- bun run build:ci
        env:
          DOPPLER_TOKEN: ${{ secrets.DOPPLER_TOKEN }}

      - name: Deploy to live channel
        if: github.event_name == 'push'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: dandd-ea955
          target: app
          # Pin firebase-tools: 15.22.1+ regressed against action-hosting-deploy@v0
          # ("supplied version ... is the current active version" on every release).
          # 15.22.0 is the last version this action deployed cleanly (2026-06-22).
          firebaseToolsVersion: "15.22.0"

      - name: Deploy preview channel
        # Workshop workers already run local Playwright checks. Their short-lived
        # PRs can arrive in parallel, so creating a Firebase channel for each one
        # exhausts the site's preview quota and blocks otherwise valid releases.
        # Keep previews for human branches while automated Workshop PRs use the
        # successful build job itself as their required check.
        if: github.event_name == 'pull_request' && !startsWith(github.head_ref, 'agent/workshop-')
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: dandd-ea955
          target: app
          firebaseToolsVersion: "15.22.0"

      - name: Deploy database and upload rules
        if: github.event_name == 'push'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          bunx firebase-tools@15.22.0 deploy --only firestore:rules,storage \
            --project dandd-ea955 --non-interactive

      - name: Deploy Cloud Functions
        if: github.event_name == 'push'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          npm --prefix functions ci
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          bunx firebase-tools@15.22.0 deploy --only functions \
            --project dandd-ea955 --non-interactive
